[package]
name = "cargo-quickstart"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Scaffold curated, best-practice Rust projects (CLI, lib, wasm, axum, embedded) with CI and git hooks built in."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jvishnefske/cargo-quickstart"
readme = "README.md"
keywords = ["cargo-subcommand", "template", "scaffold", "generator", "starter"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[[bin]]
name = "cargo-quickstart"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
inquire = "0.7"
minijinja = { version = "2", features = ["custom_syntax"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
