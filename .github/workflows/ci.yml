name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # --include-ignored runs the heavier test that scaffolds the `lib` and
      # `cli` templates and compiles them — proving the generator's core promise.
      - name: Test (including generated-project compile checks)
        run: cargo test --locked -- --include-ignored

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Same test set as the `test` job (including the generated-project
      # compile checks). Threshold is set just below the measured baseline
      # (73.7% lines) so coverage can only ratchet up.
      - name: Coverage
        run: cargo llvm-cov --locked --lcov --output-path lcov.info --fail-under-lines 73 -- --include-ignored

      - name: Coverage summary
        if: always()
        run: cargo llvm-cov report --summary-only

      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore
